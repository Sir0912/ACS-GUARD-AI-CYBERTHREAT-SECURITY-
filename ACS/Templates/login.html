<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Login</title>
  </head>
  <body>
    <h1>Employee Login</h1>

    <form method="POST" action="http://127.0.0.1:5003/login">
      <input
        type="email"
        name="email"
        placeholder="Email"
        required
      /><br /><br />
      <input
        type="password"
        name="password"
        placeholder="Password"
        required
      /><br /><br />
      <button type="submit">Login</button>
    </form>

    {% if error %}
    <p style="color: red">{{ error }}</p>
    {% endif %}
  </body>
</html>
